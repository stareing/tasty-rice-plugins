name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (without v prefix), e.g. 0.1.1"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Pack release zips
        run: npm run release:pack

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/*.zip
          body: |
            Automatically built from `${{ github.sha }}`.

            **Install (Chrome / Edge / Brave / any Chromium):**
            1. Download `media-stream-grabber.zip` below and unzip it.
            2. Open `chrome://extensions` and turn on **Developer mode** (top-right).
            3. Click **Load unpacked** and pick the unzipped folder.

            The same flow upgrades an existing install — just point "Load unpacked" at the new folder, or click the refresh icon on the extension card.
